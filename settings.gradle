pluginManagement {
  def jfrogUrl = providers.environmentVariable('JFROG_GRADLE_REPOSITORY_URL').getOrNull()
  def jfrogUsername = providers.environmentVariable('JFROG_USERNAME').getOrNull()
  def jfrogToken = providers.environmentVariable('JFROG_IDENTITY_TOKEN').getOrNull()

  repositories {
    if (jfrogUrl) {
      if (!jfrogUsername || !jfrogToken) {
        throw new GradleException('JFROG_USERNAME and JFROG_IDENTITY_TOKEN are required when JFROG_GRADLE_REPOSITORY_URL is set')
      }
      maven {
        name = 'jfrog'
        url = uri(jfrogUrl)
        credentials {
          username = jfrogUsername
          password = jfrogToken
        }
      }
    }
    else {
      gradlePluginPortal()
    }
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

  def jfrogUrl = providers.environmentVariable('JFROG_GRADLE_REPOSITORY_URL').getOrNull()
  def jfrogUsername = providers.environmentVariable('JFROG_USERNAME').getOrNull()
  def jfrogToken = providers.environmentVariable('JFROG_IDENTITY_TOKEN').getOrNull()

  repositories {
    if (jfrogUrl) {
      if (!jfrogUsername || !jfrogToken) {
        throw new GradleException('JFROG_USERNAME and JFROG_IDENTITY_TOKEN are required when JFROG_GRADLE_REPOSITORY_URL is set')
      }
      maven {
        name = 'jfrog'
        url = uri(jfrogUrl)
        credentials {
          username = jfrogUsername
          password = jfrogToken
        }
      }
    }
    else {
      mavenCentral()
    }
  }
}

rootProject.name = 'spring-petclinic'
